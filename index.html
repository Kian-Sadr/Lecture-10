<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style_1.css">
    <title>Lecture 10</title>
  </head>
  <body>
    <h1>CSS Grid Positioning</h1>
    <div id="pictures">
      <img src="flower.jpg" alt="Sunflower">
      <img src="cloud.jpg" alt="Cloud">
      <img src="cat.jpg" alt="Cat">
      <img src="horse.jpg" alt="Horse">
    </div>
    <div id="texts">
      <span id="flower">Flower</span>
      <span id="cloud">Cloud</span>
      <span id="cat">Cat</span>
      <span id="horse">Horse</span>
    </div>
  </body>
</html>
